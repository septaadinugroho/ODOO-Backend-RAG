[pytest]
# The suite runs on SQLite with LLM_PROVIDER=null (see tests/conftest.py), so it
# needs no container and no credentials — `pytest` from the repo root just works.
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -q --strict-markers

# Keep third-party deprecation noise out of the report; our own warnings still show.
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

markers =
    postgres: needs a live PostgreSQL instance (skips automatically when absent)
